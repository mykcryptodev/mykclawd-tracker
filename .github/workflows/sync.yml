name: Sync

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated list of jobs to run (portfolio, yankees, aero, all). Defaults to all.'
        required: false
        default: 'all'

# Shared env injected into every job
env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
  CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }}
  NEXT_PUBLIC_THIRDWEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_THIRDWEB_CLIENT_ID }}
  CDP_API_KEY: ${{ secrets.CDP_API_KEY }}

jobs:
  # ── shared setup artifact ────────────────────────────────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}

  # ── Portfolio NAV sync (Zerion) ─────────────────────────────────────────────
  # Runs the sync directly instead of curling the Vercel endpoint: that endpoint
  # returns 200 before the background work starts, so failures were invisible
  # (the DB silently went stale for 9 days while every run reported success).
  sync-portfolio:
    name: Portfolio NAV sync
    if: ${{ github.event_name == 'schedule' || inputs.jobs == 'all' || contains(inputs.jobs, 'portfolio') }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}

      - name: Run portfolio sync
        env:
          ZERION_API_KEY: ${{ secrets.ZERION_API_KEY }}
          BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
          DEFINITIVE_API_KEY: ${{ secrets.DEFINITIVE_API_KEY }}
          DEFINITIVE_API_SECRET: ${{ secrets.DEFINITIVE_API_SECRET }}
        run: pnpm tsx scripts/run-portfolio-sync.ts

  # ── Yankees bets seed/sync ──────────────────────────────────────────────────
  sync-yankees:
    name: Yankees bets seed
    if: ${{ github.event_name == 'schedule' || inputs.jobs == 'all' || contains(inputs.jobs, 'yankees') }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}

      - name: Seed Yankees bets
        run: pnpm tsx scripts/seed-yankees-bets.ts

  # ── Aerodrome LP sync ────────────────────────────────────────────────────────
  sync-aero:
    name: Aerodrome LP sync
    if: ${{ github.event_name == 'schedule' || inputs.jobs == 'all' || contains(inputs.jobs, 'aero') }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}

      - name: Run Aerodrome sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: pnpm tsx scripts/run-aero-sync.ts
