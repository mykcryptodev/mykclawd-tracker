name: Sync

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Comma-separated list of jobs to run (portfolio, yankees, aero, all). Defaults to all.'
        required: false
        default: 'all'

# Shared env injected into every job
env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
  CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }}
  NEXT_PUBLIC_THIRDWEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_THIRDWEB_CLIENT_ID }}

jobs:
  # ── shared setup artifact ────────────────────────────────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}

  # ── Portfolio NAV sync (Zerion) ─────────────────────────────────────────────
  sync-portfolio:
    name: Portfolio NAV sync
    if: ${{ github.event_name == 'schedule' || inputs.jobs == 'all' || contains(inputs.jobs, 'portfolio') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger portfolio sync via API
        run: |
          APP_URL='${{ secrets.APP_URL || 'https://mykclawd.xyz' }}'
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            "$APP_URL/api/portfolio/sync")
          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Status: $STATUS"
          echo "Body: $BODY"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "429" ]; then
            echo "Sync failed with status $STATUS"
            exit 1
          fi

  # ── Yankees bets seed/sync ──────────────────────────────────────────────────
  sync-yankees:
    name: Yankees bets seed
    if: ${{ github.event_name == 'schedule' || inputs.jobs == 'all' || contains(inputs.jobs, 'yankees') }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}

      - name: Seed Yankees bets
        run: pnpm tsx scripts/seed-yankees-bets.ts

  # ── Aerodrome LP sync ────────────────────────────────────────────────────────
  sync-aero:
    name: Aerodrome LP sync
    if: ${{ github.event_name == 'schedule' || inputs.jobs == 'all' || contains(inputs.jobs, 'aero') }}
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ github.sha }}

      - name: Run Aerodrome sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
        run: pnpm tsx scripts/run-aero-sync.ts
