name: Aero Backfill

on:
  workflow_dispatch: {}

env:
  TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
  CG_DEMO_KEY: ${{ secrets.CG_DEMO_KEY }}
  NEXT_PUBLIC_THIRDWEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_THIRDWEB_CLIENT_ID }}
  CDP_API_KEY: ${{ secrets.CDP_API_KEY }}

jobs:
  backfill:
    name: Aero full-history backfill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Aerodrome backfill (365 days)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: pnpm tsx scripts/aero-backfill.ts

      # Fill the aero_snapshots gap with one synthetic daily row per day since LP
      # inception (hodlUsd exact from CoinGecko daily closes; stratUsd = hodl +
      # cumulative AERO — LP IL is 0 in these rows, needs archive reads to be exact).
      # Idempotent: deletes + regenerates midnight-aligned rows only, never live rows.
      - name: Backfill historical daily snapshots
        run: pnpm tsx scripts/aero-history-backfill.ts
